name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Run examples
      # Names must match examples/ on disk (wave-66 fix): the previous list
      # ran three targets that do not exist (basic_consensus, custom_agent,
      # three_agent_council) — stale CI metadata masking real failures.
      run: |
        cargo run --example basic
        cargo run --example ml_ensembling
        cargo run --example multi_round
        cargo run --example veto
        cargo run --example weighted_voting
      shell: bash

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run cargo-audit
      uses: rustsec/audit-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # NOTE (wave-66): the cargo-outdated step was removed — the command was
    # never installed in this job ("no such command: outdated"), and stale-dep
    # detection is dependabot's registered job on this repo already.

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Run benchmarks
      # criterion 0.8 removed the "bencher" output format that
      # benchmark-action consumed (wave-66 fix: 'Unrecognized option:
      # output-format'). Run the suite plainly; reintroduce github-action-
      # benchmark only with a tool format criterion actually supports.
      run: cargo bench
